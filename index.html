<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ı love</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Texture creation
        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            context.fillStyle = 'rgba(0,0,0,0)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = 'Bold 80px Arial';
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, canvas.width / 2, canvas.height / 2);
            return new THREE.CanvasTexture(canvas);
        }

        const texture = createTextTexture('ı love', '#ff69b4'); // Hot pink
        const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // Heart parametric formula
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return new THREE.Vector3(x, y + 6, 0); // Added +6 to center it roughly
        }

        // Create the 3D heart effect
        const numHearts = 18;
        const pointsPerHeart = 50;

        for (let i = 0; i < numHearts; i++) {
            const innerGroup = new THREE.Group();
            // Rotate each heart outline around Y and X to create 3D volume
            innerGroup.rotation.y = (Math.PI * i) / numHearts;
            innerGroup.rotation.x = (Math.PI * i) / (numHearts * 2);

            for (let j = 0; j < pointsPerHeart; j++) {
                const t = (j / pointsPerHeart) * Math.PI * 2;
                const pos = getHeartPoint(t);

                const plane = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), material);
                plane.position.copy(pos);

                // Orient the text to follow the curve
                const tNext = ((j + 1) / pointsPerHeart) * Math.PI * 2;
                const posNext = getHeartPoint(tNext);
                const angle = Math.atan2(posNext.y - pos.y, posNext.x - pos.x);
                plane.rotation.z = angle;

                innerGroup.add(plane);
            }
            heartGroup.add(innerGroup);
        }

        camera.position.z = 60;

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            heartGroup.rotation.y += 0.015;
            heartGroup.rotation.x += 0.007;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
